<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../core/course-config.js"></script>
<script src="../core/course.js"></script>
<script src="../core/row-limit-guard.js"></script>
<!--
  Your dashboard. Two areas:
    Dashboards  one board per lesson. Your panels go in boards.js,
                under the lesson they belong to. This page is the course's.
    Raw data    the four tables exactly as stored.
  The line under the title says whether the app is recording: the latest visit, by itself.
-->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #F4F4F2; color: #1C1C1A;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 17px; margin: 0 0 6px; }
  .muted { color: #6B6B66; font-size: 13px; line-height: 1.5; }
  .copy-table { float: right; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 8px; }
  .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .parts button { padding: 14px 16px; font-size: 16px; font-weight: 700; border-radius: 12px; border: 1px solid #E2E2DE; background: #FAFAF8; color: #6B6B66; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .parts button.on { background: #1C1C1A; color: #fff; border-color: #1C1C1A; }
  .parts b { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .parts small { display: block; margin-top: 4px; font-size: 12.5px; font-weight: 500; opacity: .75; }
  .parts .cnt { font-size: 12px; min-width: 22px; padding: 2px 7px; border-radius: 999px; background: rgba(0,0,0,.08); }
  .parts button.on .cnt { background: rgba(255,255,255,.2); }
  .card { background: #fff; border: 1px solid #E2E2DE; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  button {
    font: inherit; font-size: 14px; cursor: pointer; border-radius: 8px;
    padding: 8px 14px; border: 1px solid #CFCFCA; background: #fff; color: #1C1C1A;
  }
  button.primary { background: #1C1C1A; color: #fff; border-color: #1C1C1A; }
  button:disabled { opacity: 0.5; cursor: default; }
  .linkish { background: none; border: none; color: #6B6B66; text-decoration: underline; padding: 0; }
  a.linkish { font-size: 14px; }
  input { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid #CFCFCA; border-radius: 8px; width: 100%; }
  .login { max-width: 360px; margin: 12vh auto 0; }
  .login label { display: block; font-size: 13px; color: #6B6B66; margin: 14px 0 6px; }
  .login button { margin-top: 18px; width: 100%; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .result { font-size: 14px; }
  .ok { color: #1F7A3F; }
  .bad { color: #B42318; }

  .recording { margin: -8px 0 16px; font-size: 13.5px; color: #4A4A45; }
  .recording .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #1F9D55; margin-right: 6px; vertical-align: 1px; }
  .recording.idle { color: #8A8A85; } .recording.idle .dot { background: #C8C8C2; }
  .recording a { color: inherit; }
  /* The areas */
  .areas { display: flex; gap: 4px; background: #E8E8E4; padding: 4px; border-radius: 10px; }
  .areas button { border: none; background: none; padding: 7px 16px; font-weight: 600; color: #4A4A45; }
  .areas button.on { background: #fff; color: #1C1C1A; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* Dashboards: lessons down the side, the board on the right */
  .boards { display: grid; grid-template-columns: 220px 1fr; gap: 18px; align-items: start; }
  .lessons { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 16px; }
  .lessons button { text-align: left; border: none; background: none; padding: 9px 12px; border-radius: 8px; font-size: 14px; color: #4A4A45; }
  .lessons button .n { display: inline-block; width: 22px; color: #A8A8A2; font-weight: 700; }
  .lessons button.on { background: #fff; color: #1C1C1A; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .lessons button.on .n { color: #C2410C; }
  .lessons .sep { height: 1px; background: #E2E2DE; margin: 6px 4px; }
  .board-head { margin: 2px 0 14px; }
  .board-head .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #C2410C; }
  .board-head h2 { font-size: 22px; margin: 4px 0 4px; }
  .placeholder { border: 1.5px dashed #CFCFCA; border-radius: 12px; padding: 26px; text-align: center; color: #6B6B66; font-size: 14px; line-height: 1.6; }
  .placeholder a { color: #C2410C; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) {
    .boards, .checks { grid-template-columns: 1fr; }
    .lessons { position: static; flex-direction: row; flex-wrap: wrap; }
    .lessons .sep { display: none; }
  }

  .tabs { display: flex; gap: 6px; margin: 4px 0 14px; flex-wrap: wrap; }
  .tabs button.on { background: #1C1C1A; color: #fff; border-color: #1C1C1A; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #EEEEEA; white-space: nowrap; }
  th { color: #6B6B66; font-weight: 600; background: #FAFAF8; position: sticky; top: 0; }
  td.num { font-variant-numeric: tabular-nums; }
  .empty { padding: 24px; text-align: center; color: #6B6B66; font-size: 14px; }
  .flag { color: #B42318; font-size: 12.5px; }
  details summary { cursor: pointer; color: #6B6B66; font-size: 12.5px; }
  details pre { white-space: pre-wrap; font-size: 12px; background: #FAFAF8; padding: 10px; border-radius: 8px; margin: 6px 0 0; }
  td.def { white-space: normal; min-width: 220px; }
</style>
</head>
<body>

<div class="wrap login" id="login-page" hidden>
  <h1>Sign in</h1>
  <p class="muted">Use the account you created in your Supabase project (Authentication → Users).</p>
  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button class="primary" type="submit">Sign in</button>
    <p class="result bad" id="login-error"></p>
  </form>
</div>

<div class="wrap" id="dash" hidden>
  <header>
    <h1>Study dashboard</h1>
    <div class="areas" id="areas">
      <button data-area="boards">Dashboards</button>
      <button data-area="raw">Raw data</button>
    </div>
    <div class="row"><a class="linkish" href="../">Home</a><button class="linkish" id="sign-out">Sign out</button></div>
  </header>
  <p class="recording" id="recording"></p>

  <!-- Dashboards: one board per lesson -->
  <div id="area-boards" class="boards">
    <nav class="lessons" id="lesson-list"></nav>
    <div>
      <div class="board-head" id="board-head"></div>
      <div id="board"></div>
    </div>
  </div>

  <!-- Raw data -->
  <div id="area-raw" hidden>
    <section class="card">
      <h2>Raw data</h2>
      <p class="muted">Exactly what is stored, newest first. Nothing is filtered. Times are in your time zone.</p>
      <div class="tabs" id="tabs"></div>
      <p class="muted" id="table-count"></p>
      <div class="scroll"><div id="table"></div></div>
    </section>
  </div>

    </section>
  </div>
</div>

<script>
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const $ = id => document.getElementById(id);
  const esc = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
</script>
<!-- Your panels, one list per lesson. That file is yours; this page is the course's. -->
<script src="boards.js"></script>
<script>

  // ---- Dashboards ----------------------------------------------------
  let lessons = [], board = null;

  async function loadLessons() {
    const [list, current] = await Promise.all([
      fetch('../units/lessons.json', { cache: 'no-store' }).then(r => r.json()).catch(() => []),
      Course.lesson().then(r => r.lesson).catch(() => '')
    ]);
    lessons = list.filter(l => l.unit && l.checker);   // slides-only lessons have no board
    board = board || current || 'example';
  }

  function renderLessonList() {
    $('lesson-list').innerHTML =
      `<button data-b="example" class="${board === 'example' ? 'on' : ''}"><span class="n">·</span>Example</button><div class="sep"></div>` +
      lessons.map(l => `<button data-b="${l.unit}" class="${board === l.unit ? 'on' : ''}"><span class="n">${l.n}</span>${esc(l.title)}</button>`).join('');
  }

  async function renderBoard() {
    renderLessonList();
    const l = lessons.find(x => x.unit === board);
    $('board-head').innerHTML = l
      ? `<div class="kicker">Lesson ${l.n}</div><h2>${esc(l.title)}</h2><div class="muted">${esc(l.question)}</div>`
      : `<div class="kicker">Example</div><h2>How a panel is built</h2><div class="muted">A view in <code>analysis</code> does the counting; the panel only shows it. Copy this pattern.</div>`;
    const panels = BOARDS[board] || [];
    if (!panels.length) {
      $('board').innerHTML = `<div class="placeholder">Nothing built for this lesson yet.<br>
        What to build is in <a href="../view.html?f=units/${esc(board)}.md">the guided walkthrough</a>. Your panels for it go here.</div>`;
      return;
    }
    const card = (p, i) =>
      `<section class="card"><h2>${esc(p.title)}</h2>${p.view ? `<p class="muted">From <code>analysis.${esc(p.view)}</code></p>` : ''}<div id="panel-${i}"></div></section>`;
    // A lesson board has two parts, as two big tabs: what the guided walkthrough asks for, built with the
    // assistant, and what the team added on its own (own: true) to answer questions it couldn't.
    // Each board reopens on the tab last viewed here (a viewing preference only, no progress).
    // A panel that shows a table gets a "Copy table" button, for pasting into a breakdown question.
    const show = (p, i) => Promise.resolve(p.render($(`panel-${i}`))).then(() => {
      const body = $(`panel-${i}`); if (!body || !body.querySelector('table')) return;
      const btn = document.createElement('button'); btn.className = 'copy-table'; btn.textContent = 'Copy table';
      btn.addEventListener('click', async () => {
        const rows = [...body.querySelectorAll('table tr')].map(tr => [...tr.children].map(c => c.innerText.trim()).join('\t'));
        try { await navigator.clipboard.writeText(rows.join('\n')); btn.textContent = 'Copied'; } catch { btn.textContent = 'Copy blocked'; }
        setTimeout(() => { btn.textContent = 'Copy table'; }, 1500);
      });
      body.parentElement.querySelector('h2').append(btn);
    }).catch(() => {});
    if (!l) { $('board').innerHTML = panels.map(card).join(''); panels.forEach(show); return; }
    const own = panels.map((p, i) => [p, i]).filter(([p]) => p.own), shared = panels.map((p, i) => [p, i]).filter(([p]) => !p.own);
    let part = 'together';
    try { part = localStorage.getItem('part:' + board) || 'together'; } catch {}
    const list = part === 'own' ? own : shared;
    $('board').innerHTML = `<div class="parts">
        <button data-part="together" class="${part === 'together' ? 'on' : ''}"><span><b>Guided walkthrough<span class="cnt">${shared.length}</span></b><small>Built step by step with your assistant</small></span></button>
        <button data-part="own" class="${part === 'own' ? 'on' : ''}"><span><b>On your own<span class="cnt">${own.length}</span></b><small>After the walkthrough, when the questions ask for more</small></span></button></div>` +
      (list.map(([p, i]) => card(p, i)).join('') || (part === 'own'
        ? `<div class="placeholder">This part starts after the walkthrough, at the questions. When a question needs something your board doesn't show, you lead: decide what's missing, define it, and ask your assistant to build it here.</div>`
        : '<div class="placeholder">Nothing yet.</div>'));
    $('board').querySelectorAll('[data-part]').forEach(b => b.addEventListener('click', () => {
      try { localStorage.setItem('part:' + board, b.dataset.part); } catch {}
      renderBoard();
    }));
    list.forEach(([p, i]) => show(p, i));
    return;
  }

  // ---- Raw data -------------------------------------------------------
  const TABLES = {
    sessions:   { order: 'started_at' },
    clicks:     { order: 'created_at' },
    selections: { order: 'created_at' },
    identities: { order: 'created_at' }
  };
  let current = 'sessions';

  function renderTabs() {
    $('tabs').innerHTML = Object.keys(TABLES).map(t =>
      `<button data-t="${t}" class="${t === current ? 'on' : ''}">${t}</button>`).join('');
  }

  const v0 = x => typeof x === 'string';

  async function loadTable() {
    renderTabs();
    $('table').innerHTML = '<div class="empty">Loading…</div>';
    const { count } = await db.from(current).select('*', { count: 'exact', head: true });
    const { data, error } = await db.from(current).select('*')
      .order(TABLES[current].order, { ascending: false }).limit(50);
    if (error) { $('table').innerHTML = `<div class="empty bad">${esc(error.message)}</div>`; return; }
    $('table-count').textContent = `${count ?? '?'} rows in total · showing the newest ${Math.min(50, data.length)}`;
    if (!data.length) { $('table').innerHTML = '<div class="empty">No rows yet.</div>'; return; }
    const cols = Object.keys(data[0]);
    $('table').innerHTML = `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
      data.map(r => `<tr>${cols.map(c => {
        // Times in the viewer's own time zone, like every other page.
        const v = c.endsWith('_at') && v0(r[c]) ? new Date(r[c]).toLocaleString('sv-SE') : r[c];
        return `<td class="${typeof v === 'number' ? 'num' : ''}">${v === null ? '<span class="muted">null</span>' : esc(v)}</td>`;
      }).join('')}</tr>`).join('')}</tbody></table>`;
  }

  // ---- Is the app recording? ------------------------------------------
  // The latest visit that wasn't practice data, shown under the title. No button: it is always
  // there, and it goes grey when nothing has been recorded yet.
  async function recording() {
    const el = $('recording');
    const { data, error } = await db.from('sessions').select('started_at, is_test')
      .eq('is_synthetic', false).order('started_at', { ascending: false }).limit(1);
    if (error) { el.className = 'recording idle'; el.innerHTML = `<span class="dot"></span>Could not check recording: ${esc(error.message)}`; return; }
    if (!data.length) {
      el.className = 'recording idle';
      el.innerHTML = '<span class="dot"></span>No visits recorded yet. <a href="../app/?test=1">Open the app as a test run</a> to try it.';
      return;
    }
    const v = data[0], m = Math.max(0, Math.round((Date.now() - new Date(v.started_at)) / 60000));
    const ago = m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
    el.className = 'recording';
    el.innerHTML = `<span class="dot"></span><b>Your app is recording</b> · last visit ${ago} (${v.is_test ? 'a test run' : 'a participant'})`;
  }


  // ---- Areas, remembered in the address (#raw, #checks, #unit-02) ------
  function showArea(area) {
    for (const a of ['boards', 'raw']) $(`area-${a}`).hidden = a !== area;
    $('areas').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.area === area));
    if (area === 'raw') loadTable();
    if (area === 'boards') renderBoard();
    history.replaceState(null, '', '#' + (area === 'boards' ? board : area));
  }

  async function show() {
    const { data: { session } } = await db.auth.getSession();
    $('login-page').hidden = !!session;
    $('dash').hidden = !session;
    if (!session) return;
    const h = location.hash.slice(1);
    if (h && h !== 'raw' && h !== 'checks') board = h;
    await loadLessons();
    showArea(h === 'raw' ? h : 'boards');
    recording();
  }

  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { error } = await db.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
    $('login-error').textContent = error ? error.message : '';
    show();
  });
  $('sign-out').addEventListener('click', async () => { await db.auth.signOut(); show(); });
  $('areas').addEventListener('click', (e) => { const b = e.target.closest('[data-area]'); if (b) showArea(b.dataset.area); });
  $('lesson-list').addEventListener('click', (e) => { const b = e.target.closest('[data-b]'); if (b) { board = b.dataset.b; showArea('boards'); } });
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b) { current = b.dataset.t; loadTable(); } });
  show();
</script>
</body>
</html>
