<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Checker</title>
<!--
  The checker for a lesson: open it as checker/?lesson=lesson-02.
  Answer each question from YOUR dashboard. It tells you which answers
  are right, never what the right answer is.

  It holds only a fingerprint of each answer (a one-way scramble), not
  the answer itself. Your attempts are remembered in this browser.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4F4F2; color: #1C1C1A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 80px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #6B6B66; margin: 0 0 6px; }
  h1 { font-size: 30px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .lead { color: #4A4A45; font-size: 15px; line-height: 1.6; margin: 0 0 28px; }
  .q { background: #fff; border: 1px solid #E2E2DE; border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; display: grid; grid-template-columns: 28px 1fr; gap: 4px 12px; }
  .q.right { border-color: #9FD3B0; background: #F5FBF7; }
  .q.wrong { border-color: #F0B8B2; }
  .n { font-weight: 700; color: #6B6B66; font-size: 15px; padding-top: 1px; }
  .text { font-size: 15px; line-height: 1.55; }
  .answer { grid-column: 2; display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  input { font: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid #CFCFCA; border-radius: 8px; width: 220px; }
  .verdict { font-size: 14px; }
  button.one { font-size: 14px; padding: 8px 14px; background: #fff; color: #1C1C1A; border: 1px solid #CFCFCA; border-radius: 8px; }
  .right button.one { display: none; }
  .right .verdict { color: #1F7A3F; font-weight: 600; }
  .wrong .verdict { color: #B42318; }
  .tries { font-size: 12px; color: #8A8A85; }
  .bar { position: sticky; bottom: 0; background: #F4F4F2; padding: 16px 0 0; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  button { font: inherit; font-size: 15px; font-weight: 600; padding: 12px 24px; border-radius: 10px; border: none; background: #1C1C1A; color: #fff; cursor: pointer; }
  .score { font-size: 15px; color: #4A4A45; }
  .all { background: #E8F5EC; border: 1px solid #9FD3B0; border-radius: 12px; padding: 16px 20px; margin-top: 18px; font-size: 15px; line-height: 1.55; }
  .err { color: #B42318; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow" id="eyebrow">Checker</p>
  <h1 id="title">Loading…</h1>
  <p class="lead">Answer from your dashboard, not from a one-off query: the point is that your dashboard
    gets it right. A wrong answer says "not quite", never why — finding out why is the lesson.</p>
  <form id="form"></form>
  <div class="bar"><button form="form" type="submit">Check all answers</button><span class="score" id="score"></span></div>
  <div class="all" id="all" hidden>Every answer is right. Now write the memo: its questions are at the end of
    <a id="memo-link" href="#">the exercise</a>.</div>
</div>
<script>
  const lesson = new URLSearchParams(location.search).get('lesson') || 'lesson-02';
  const KEY = `checker:${lesson}`;
  let spec = null;
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch {} };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Must match normalize() in generator/sim.mjs exactly.
  function normalize(kind, value) {
    const num = () => Number(String(value).replace(/[^0-9.\-]/g, ''));
    if (kind === 'integer') { const n = Math.round(num()); return Number.isFinite(n) ? String(n) : ''; }
    if (kind === 'percent') { const n = num(); return Number.isFinite(n) ? n.toFixed(1) : ''; }
    if (kind === 'decimal') { const n = num(); return Number.isFinite(n) ? n.toFixed(2) : ''; }
    return String(value).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean).sort().join(' ');
  }
  async function fingerprint(salt, kind, value) {
    const bytes = new TextEncoder().encode(`${salt}|${normalize(kind, value)}`);
    const d = await crypto.subtle.digest('SHA-256', bytes);
    return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  const hint = { integer: 'a whole number', percent: 'a percentage, one decimal', decimal: 'a number, two decimals', text: 'words' };

  const results = {};

  // Checks one answer. The same wrong answer again does not count as a new try.
  async function checkOne(q, value) {
    const s = saved[q.id] = saved[q.id] || { tries: 0 };
    if (s.right || !value) return;
    if (value === s.value && s.checked) { results[q.id] = false; return; }
    s.value = value; s.tries += 1; s.checked = true;
    s.right = (await fingerprint(spec.salt, q.kind, value)) === q.fingerprint;
    results[q.id] = s.right;
  }

  function render() {
    document.getElementById('form').innerHTML = spec.questions.map((q, i) => {
      const s = saved[q.id] || {};
      const state = results[q.id] === true || s.right ? 'right' : results[q.id] === false ? 'wrong' : '';
      return `<div class="q ${state}">
        <span class="n">${i + 1}</span><div class="text">${esc(q.text)}</div>
        <div class="answer">
          <input name="${q.id}" value="${esc(s.value || '')}" placeholder="${hint[q.kind]}" autocomplete="off" ${s.right ? 'readonly' : ''}>
          <button type="button" class="one" data-q="${q.id}">Check</button>
          <span class="verdict">${state === 'right' ? '✓ Right' : state === 'wrong' ? 'Not quite' : ''}</span>
          ${s.tries ? `<span class="tries">${s.tries} ${s.tries === 1 ? 'try' : 'tries'}</span>` : ''}
        </div></div>`;
    }).join('');
    const right = spec.questions.filter(q => (saved[q.id] || {}).right).length;
    document.getElementById('score').textContent = `${right} of ${spec.questions.length} right`;
    document.getElementById('all').hidden = right !== spec.questions.length;
  }

  // Keep what is typed in other boxes when one question re-renders the page.
  const typed = () => Object.fromEntries([...document.querySelectorAll('#form input')].map(i => [i.name, i.value]));
  async function checkIds(ids) {
    const values = typed();
    for (const q of spec.questions.filter(q => ids.includes(q.id))) await checkOne(q, String(values[q.id] || '').trim());
    save(); render();
    for (const [id, v] of Object.entries(values)) {
      const el = document.querySelector(`#form input[name="${id}"]`);
      if (el && !el.readOnly && !ids.includes(id)) el.value = v;
    }
  }
  const form = document.getElementById('form');
  form.addEventListener('submit', (e) => { e.preventDefault(); checkIds(spec.questions.map(q => q.id)); });
  form.addEventListener('click', (e) => { const b = e.target.closest('button.one'); if (b) checkIds([b.dataset.q]); });
  // Enter in a box checks that one question.
  form.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); checkIds([e.target.name]); }
  });

  fetch(`questions/${lesson}.json`, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(`No checker for "${lesson}".`); return r.json(); })
    .then(j => {
      spec = j;
      document.title = `${j.title} · Checker`;
      document.getElementById('eyebrow').textContent = `Checker · ${j.lesson.replace('lesson-0', 'Lesson ').replace('lesson-', 'Lesson ')}`;
      document.getElementById('title').textContent = j.title;
      // The memo's questions belong to each lesson's exercise; link there rather than repeat them.
      document.getElementById('memo-link').href = `../view.html?f=units/${lesson.replace('lesson-', 'unit-')}.md`;
      render();
    })
    .catch(err => { document.getElementById('title').innerHTML = `<span class="err">${esc(err.message)}</span>`; });
</script>
</body>
</html>
